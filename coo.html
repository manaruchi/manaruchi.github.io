<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Warm Wishes on Your New Home</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    font-family: Georgia, "Times New Roman", serif;

    background:
      radial-gradient(circle at 15% 10%, rgba(255,247,224,.95), transparent 30%),
      radial-gradient(circle at 85% 90%, rgba(239,220,185,.75), transparent 35%),
      linear-gradient(135deg, #fffdf9, #f4eadb);

    color: #43392f;
  }

  .card {
    width: min(760px, 100%);
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(164,125,67,.28);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(80,58,32,.16);
  }

  .hero {
    position: relative;
    padding: 22px 22px 0;

    background:
      linear-gradient(
        #eef7fb 0%,
        #fbf5e7 70%,
        #e7efd9 70%,
        #e7efd9 100%
      );
  }

  .hero svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 360px;
  }

  /* ============================
     FAIRY LIGHT ANIMATION
     ============================ */

  .light {
    fill: #ffd56a;
    filter: drop-shadow(0 0 4px #ffd56a);
    animation: blink 1.8s infinite ease-in-out;
  }

  .light:nth-child(2) {
    animation-delay: .25s;
  }

  .light:nth-child(3) {
    animation-delay: .5s;
  }

  .light:nth-child(4) {
    animation-delay: .75s;
  }

  .light:nth-child(5) {
    animation-delay: 1s;
  }

  .light:nth-child(6) {
    animation-delay: 1.25s;
  }

  .light:nth-child(7) {
    animation-delay: 1.5s;
  }

  .light:nth-child(8) {
    animation-delay: .4s;
  }

  .light:nth-child(9) {
    animation-delay: .9s;
  }

  .light:nth-child(10) {
    animation-delay: 1.3s;
  }

  @keyframes blink {

    0%, 100% {
      opacity: .35;
      filter:
        drop-shadow(0 0 2px #ffd56a);
    }

    50% {
      opacity: 1;

      filter:
        drop-shadow(0 0 4px #ffd56a)
        drop-shadow(0 0 9px #ffc84a);
    }

  }


  /* ============================
     CARD CONTENT
     ============================ */

  .content {
    padding: 34px 46px 46px;
    text-align: center;
  }

  .eyebrow {
    font-family: Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 2.8px;
    font-size: .72rem;
    color: #aa8750;
    margin-bottom: 12px;
  }

  h1 {
    font-weight: 500;
    color: #755a35;

    font-size:
      clamp(1.75rem, 5vw, 2.55rem);

    line-height: 1.2;
  }

  .divider {
    width: 68px;
    height: 2px;

    background:
      linear-gradient(
        90deg,
        transparent,
        #b79258,
        transparent
      );

    margin: 22px auto;
  }

  .message {
    font-size: 1.15rem;
    line-height: 1.8;
    color: #5d5349;

    max-width: 590px;
    margin: 0 auto;
  }

  .congrats {
    display: block;

    margin-top: 18px;

    color: #7b5f39;

    font-weight: 700;

    font-size: 1.23rem;
  }

  .gift-note {
    margin-top: 28px;

    font-style: italic;

    color: #766d64;

    font-size: 1rem;
  }


  /* ============================
     GIFT BUTTON
     ============================ */

  .gift-link {
    display: inline-block;

    margin-top: 18px;

    padding: 13px 30px;

    border-radius: 999px;

    text-decoration: none;

    background: #7d623d;

    color: #fff;

    font-family: Arial, sans-serif;

    font-size: .95rem;

    font-weight: 700;

    letter-spacing: .3px;

    box-shadow:
      0 8px 20px rgba(104,78,42,.22);

    transition:
      transform .2s ease,
      background .2s ease,
      box-shadow .2s ease;

    animation:
      giftFloat 3s infinite ease-in-out;
  }

  .gift-link:hover {
    transform: translateY(-3px);

    background: #674e30;

    box-shadow:
      0 11px 24px rgba(104,78,42,.28);
  }

  @keyframes giftFloat {

    0%, 100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-4px);
    }

  }

  .footer {
    margin-top: 30px;

    font-family:
      Arial,
      sans-serif;

    font-size: .72rem;

    text-transform: uppercase;

    letter-spacing: 2px;

    color: #a59a8c;
  }


  /* ============================
     MOBILE
     ============================ */

  @media (max-width: 600px) {

    body {
      padding: 12px;
    }

    .content {
      padding:
        28px
        23px
        34px;
    }

    .hero {
      padding:
        14px
        10px
        0;
    }

    .message {
      font-size: 1.05rem;
    }

  }

</style>

</head>
